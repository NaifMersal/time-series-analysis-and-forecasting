[project]
name = "ts-course"
version = "0.1.0"
description = "SDAIA 3-day Time Series Analysis & Forecasting course — slides, labs and shared helpers"
requires-python = ">=3.11,<3.14"
dependencies = [
    # nixtlaverse — the stack fpppy standardises on
    "statsforecast>=2.0",
    "utilsforecast>=0.2",
    "coreforecast>=0.0.12",
    # classical stats: STL/MSTL, Ljung-Box, ACF
    "statsmodels>=0.14",
    # data
    "pandas>=2.2",
    "numpy>=2.0",
    "pyreadr>=0.5",          # reads the FPP3 .rda datasets
    "scikit-learn>=1.5",
    # plotting
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Quarto needs a Jupyter kernel to execute the {python} cells in the decks
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

# NOTE: pmdarima is deliberately absent — it is effectively unmaintained and
# does not build against numpy 2.x. statsforecast.models.AutoARIMA covers it.

[project.optional-dependencies]
dev = [
    "nbclient>=0.10",        # used by .claude/skills/check-labs/driver.py
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

# Day 3 extras are intentionally not declared yet — the Day 3 content decision
# (ETS/ARIMA vs dynamic regression vs neural/foundation models) is still open,
# and `neuralforecast` pulls ~2.5 GB of torch. Add [neural] / [foundation] here
# once that is settled.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coursekit"]
