[project]
name = "ts-course"
version = "0.1.0"
description = "SDAIA 3-day Time Series Analysis & Forecasting course — slides, labs and shared helpers"
requires-python = ">=3.11,<3.14"
dependencies = [
    # nixtlaverse — the stack fpppy standardises on
    "statsforecast>=2.0",
    "utilsforecast>=0.2",
    "coreforecast>=0.0.12",
    # classical stats: STL/MSTL, Ljung-Box, ACF
    "statsmodels>=0.14",
    # data
    "pandas>=2.2",
    "numpy>=2.0",
    "pyreadr>=0.5",          # reads the FPP3 .rda datasets
    "scikit-learn>=1.5",
    # plotting
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Quarto needs a Jupyter kernel to execute the {python} cells in the decks
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

# NOTE: pmdarima is deliberately absent — it is effectively unmaintained and
# does not build against numpy 2.x. statsforecast.models.AutoARIMA covers it.

[project.optional-dependencies]
dev = [
    "nbclient>=0.10",        # used by .claude/skills/check-labs/driver.py
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

# Day 3's models — ETS, AutoARIMA and Theta — all live in statsforecast, which
# is already a core dependency, so Day 3 needs nothing extra to run the lecture
# decks or Lab E.
#
# AutoGluon (Lab F, Exercise 3.4) is the exception and is deliberately NOT a
# core dependency: it pulls torch, ~2.5 GB, for a zoo whose local models are a
# subset of what statsforecast already provides. Day 3 is taught on Colab,
# where that cost is sunk. Every AutoGluon cell in the lab is skip-guarded on
# `importlib.util.find_spec("autogluon")`, so both check-labs targets stay
# honest on a machine that does not have it.
day3 = [
    "autogluon.timeseries>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coursekit"]
